<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise!</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 30px 10px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 75vh;
      border: none;
    }

    button {
      margin: 20px;
      padding: 15px 30px;
      background: #ff3333;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>You've Been Rickrolled!</h1>

  <iframe
    id="rickroll"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
    title="Rick Astley - Never Gonna Give You Up"
    allow="autoplay; encrypted-media; fullscreen"
    allowfullscreen>
  </iframe>

  <button onclick="playRickroll()">Play Surprise!</button>

  <script>
    function playRickroll() {
      const video = document.getElementById("rickroll");
      video.src =
        "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
    }
  </script>
</body>
</html>
